[package]
name = "sparkypdf"
version = "1.0.1"
edition = "2024"
description = "A small, reliable PDF reader"
license = "MIT"
repository = "https://github.com/roberthendriksen/SparkyPDF"
publish = false

[[bin]]
name = "SparkyPDF"
path = "src/main.rs"

[dependencies]
muda = "0.21.2"
rfd = "0.18.0"
tao = "0.37.2"
url = "2.5.8"
webview2-com = "0.39.1"
wry = "0.57.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
